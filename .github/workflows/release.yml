name: Release
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 0.6.1). Leave blank to auto-resolve."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          SEMVER=re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def sh(*a): return subprocess.run(a,capture_output=True,text=True).stdout.strip()
          def parse(t):
              m=SEMVER.match(t); return tuple(int(p) for p in m.groups()) if m else None
          def die(msg):
              print(f"::error::{msg}",file=sys.stderr); raise SystemExit(1)
          with open("manifest.json",encoding="utf-8") as f: mv=str(json.load(f).get("version",""))
          released=sorted(v for v in (parse(t[1:]) for t in sh("git","tag","-l","v*").splitlines()) if v)
          latest=released[-1] if released else None
          override=os.environ.get("DISPATCH_VERSION","").strip()
          if not override:
              found=re.search(r"\[release\s+(\d+\.\d+\.\d+)\]",sh("git","log","-1","--pretty=%B"))
              override=found.group(1) if found else ""
          manifest_ver=parse(mv)
          if override: version=parse(override) or die(f"invalid version override {override!r} (expected X.Y.Z)")
          elif manifest_ver and (latest is None or manifest_ver>latest): version=manifest_ver
          elif latest:
              major,minor,patch=latest; patch+=1
              if patch>99: minor,patch=minor+1,0
              version=(major,minor,patch)
          else: die(f"manifest.json version {mv!r} is not X.Y.Z and there is no vX.Y.Z tag to count from")
          text="%d.%d.%d"%version
          print(f"version={text}"); print(f"tag=v{text}")
          PY
      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release/tag $TAG already exists."; exit 1
          fi
      - name: Build the mod .zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "PORYGONAL_OVERWORLD_CHARACTERS"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"; out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"; mkdir -p "$staging" "$out"
          git archive HEAD | tar -x -C "$staging"
          rm -rf "$staging/.github" "$staging/.gitattributes" "$staging/.gitignore" "$staging/.luarc.json"
          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json,sys
          p,v=sys.argv[1],sys.argv[2]
          with open(p,encoding="utf-8") as f: m=json.load(f)
          m["version"]=v
          with open(p,"w",encoding="utf-8") as f: json.dump(m,f,indent=2,ensure_ascii=False); f.write("\n")
          PY
          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          (cd "$out" && sha256sum "${MOD_ID}"-*.zip > sha256sums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_ID: "PORYGONAL_OVERWORLD_CHARACTERS"
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"
          notes=$'Download the .zip and install it from the game: MODS > Import mod .zip.'
          if [ -n "$changes" ]; then notes+=$'\n\n## Changes\n\n'"$changes"; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes" "dist/${MOD_ID}-${VERSION}.zip" "dist/sha256sums.txt"
